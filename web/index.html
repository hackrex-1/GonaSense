<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GonaSense compares crop rotations for Gombe State, Nigeria, using NASA satellite data and plain-language evidence.">
  <meta name="theme-color" content="#1F4D33">
  <title>GonaSense · Crop rotation advice for Gombe State</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-copy="skip"></a>

  <div id="demo-banner" class="demo-banner" role="status" hidden data-copy="demoBanner"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#main" data-copy-aria="brandHome">
        <img src="img/logo-dark.svg" alt="" width="64" height="64">
        <span class="wordmark" aria-hidden="true">
          <span class="wordmark-gona" data-copy="appWordmark.first"></span><span class="wordmark-sense" data-copy="appWordmark.second"></span>
        </span>
      </a>
      <div class="header-copy">
        <p class="eyebrow" data-copy="challenge"></p>
        <p class="lede" data-copy="lede"></p>
      </div>
      <p class="data-badge" id="data-badge" role="status" data-copy="loading"></p>
    </div>
  </header>

  <main id="main" class="layout wrap">
    <div class="column column-controls">
    <section class="panel controls" aria-labelledby="controls-title">
      <h2 id="controls-title" data-copy="yourFarm"></h2>

      <div class="field">
        <label for="location-select" data-copy="locationLabel"></label>
        <select id="location-select" disabled>
          <option data-copy="loading"></option>
        </select>
        <p class="hint" data-copy="locationHint"></p>
      </div>

      <fieldset class="fieldset">
        <legend data-copy="rotationLabel"></legend>
        <div id="rotation-slots" class="rotation-slots"></div>
        <button type="button" class="button secondary" id="add-year" data-copy="addYear" hidden></button>
        <p class="hint" data-copy="rotationHint"></p>
      </fieldset>

      <details class="priorities" open>
        <summary data-copy="prioritiesTitle"></summary>
        <p class="hint" id="priorities-hint" data-copy="prioritiesHint"></p>
        <div id="priorities-list" class="priorities-list"></div>
      </details>

      <fieldset class="fieldset scenario-fieldset">
        <legend data-copy="scenarioTitle"></legend>
        <p class="hint" data-copy="scenarioHint"></p>
        <div class="scenario-grid">
          <fieldset class="scenario-group">
            <legend data-copy="rainLabel"></legend>
            <div id="rain-options" class="radio-row"></div>
          </fieldset>
          <fieldset class="scenario-group">
            <legend data-copy="tempLabel"></legend>
            <div id="temp-options" class="radio-row"></div>
          </fieldset>
        </div>
      </fieldset>
    </section>
    </div>

    <div class="column column-cards">
    <section class="panel cards-panel" aria-labelledby="cards-title">
      <h2 id="cards-title" data-copy="cardsTitle"></h2>
      <p class="hint" data-copy="cardsHint"></p>
      <p id="cards-status" class="visually-hidden" aria-live="polite"></p>
      <div id="cards" class="cards"></div>
    </section>
    </div>

    <div class="column column-centre">
    <section class="panel charts-panel" aria-labelledby="charts-title">
      <h2 id="charts-title" data-copy="chartsTitle"></h2>

      <h3 data-copy="onsetTitle"></h3>
      <div class="chart-wrap">
        <canvas id="onset-chart" role="img" data-copy-aria="onsetChartAria"></canvas>
      </div>
      <p id="onset-note" class="hint"></p>

      <h3 data-copy="ndviTitle"></h3>
      <div class="chart-wrap">
        <canvas id="ndvi-chart" role="img" data-copy-aria="ndviChartAria"></canvas>
      </div>
      <p id="ndvi-note" class="hint"></p>
    </section>

    <section class="panel map-panel" aria-labelledby="map-title">
      <h2 id="map-title" data-copy="mapTitle"></h2>
      <p class="hint" data-copy="mapHint"></p>
      <div id="map" class="map" role="region" data-copy-aria="mapAria"></div>
      <p id="map-note" class="hint" role="status"></p>
    </section>
    </div>

    <section class="panel limits" aria-labelledby="limits-title">
      <h2 id="limits-title" data-copy="limitsTitle"></h2>
      <p class="hint" data-copy="limitsIntro"></p>
      <div id="limits-body"></div>
    </section>

    <section class="panel glossary" aria-labelledby="glossary-title">
      <h2 id="glossary-title" data-copy="glossaryTitle"></h2>
      <p class="hint" data-copy="glossaryHint"></p>
      <div id="glossary-list" class="glossary-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p data-copy="footer"></p>
    </div>
  </footer>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
